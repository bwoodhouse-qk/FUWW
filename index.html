<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FUWW — Grocery list</title>
    <link rel="stylesheet" href="src/styles.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main>
      <div id="setup">
      <h1>FUWW</h1>
      <p>Your grocery list, one item at a time.</p>
      <button id="shop-button" type="button" aria-describedby="shop-reminder">Shop at Woolworths</button>
      <button id="pak-button" type="button" aria-describedby="shop-reminder">Shop at Pak n Save</button>
      <p id="store-status" role="status">Shopping at: Woolworths</p>
      <p id="shop-reminder">Log in to Woolworths before you start shopping.</p>
      <p id="shop-status" role="status"></p>
      <form id="list-form">
        <label for="grocery-list">Grocery list</label>
        <p id="list-help">Paste one item per line.</p>
        <textarea id="grocery-list" rows="8" aria-describedby="list-help"
          placeholder="Milk&#10;Bread&#10;Apples"></textarea>
        <div class="list-actions">
          <button type="submit">Create list</button>
          <button id="start-button" type="button" hidden>Start shopping</button>
          <button id="update-button" type="button" hidden>Update list</button>
        </div>
      </form>
      </div>
      <section aria-labelledby="items-heading">
        <h2 id="items-heading">Your items</h2>
        <p id="list-status" role="status">No items yet.</p>
        <ol id="items" tabindex="0" aria-labelledby="items-heading"></ol>
        <div class="item-navigation">
        <button id="previous-button" type="button" hidden disabled>Previous</button>
        <button id="next-button" type="button" hidden disabled>Next</button>
        </div>
      </section>
    </main>
  </body>
</html>
